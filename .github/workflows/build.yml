name: Build native settings launcher APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platform;android-34'

      - name: Build
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: native-settings-launcher
          path: dist/*.apk
